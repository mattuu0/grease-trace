name: Build and Deploy

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (client)
        run: npm install
        working-directory: ./client

      - name: Build client
        run: npm install && npm run build
        working-directory: ./client

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  build-server:
    needs: build-client
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get version from tauri.conf.json
        id: get_version
        shell: bash
        run: |
          if [ -f "./server/tauri.conf.json" ]; then
            VERSION=$(node -p "require('./server/tauri.conf.json').version")
          else
            VERSION=$(node -p "require('./server/src-tauri/tauri.conf.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Install dependencies (server)
        run: npm install
        working-directory: ./server

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Build Tauri app
        run: npm run tauri build
        working-directory: ./server

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-${{ matrix.platform }}-${{ steps.get_version.outputs.version }}
          path: |
            ./server/src-tauri/target/release/bundle/**/*.msi
            ./server/src-tauri/target/release/bundle/**/*.exe
            ./server/src-tauri/target/release/bundle/**/*.dmg
            ./server/src-tauri/target/release/bundle/**/*.app.tar.gz
          retention-days: 5

  create-release:
    needs: build-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get version from tauri.conf.json
        id: get_version
        run: |
          if [ -f "./server/tauri.conf.json" ]; then
            VERSION=$(node -p "require('./server/tauri.conf.json').version")
          else
            VERSION=$(node -p "require('./server/src-tauri/tauri.conf.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Check if release exists
        id: check_release
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $TAG already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $TAG does not exist"
          fi

      - name: Download all artifacts
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display structure of downloaded files
        if: steps.check_release.outputs.exists == 'false'
        run: ls -R ./artifacts

      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./artifacts/**/*.msi
            ./artifacts/**/*.exe
            ./artifacts/**/*.dmg
            ./artifacts/**/*.app.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
